name: Auto-merge dependabot PR

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

jobs:
  automerge:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Merge green dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SELF: ${{ github.workflow }}
        run: |
          set -euo pipefail

          nums=$(gh pr list --state open --limit 50 --json number,author \
            --jq '.[] | select(.author.is_bot == true
                  and (.author.login | test("^(app/)?dependabot(\\[bot\\])?$")))
                  | .number')

          if [ -z "$nums" ]; then
            echo "No open dependabot PR."
            exit 0
          fi

          failed=0
          for num in $nums; do
            pr=$(gh pr view "$num" --json headRefOid,statusCheckRollup)
            sha=$(printf '%s' "$pr" | jq -r '.headRefOid')
            checks=$(printf '%s' "$pr" \
              | jq "[.statusCheckRollup[] | select(.workflowName != \"$SELF\")]")

            bad=$(printf '%s' "$checks" | jq '[.[]
              | (.conclusion // .state)
              | select(. == "FAILURE" or . == "ERROR" or . == "TIMED_OUT"
                       or . == "CANCELLED" or . == "ACTION_REQUIRED"
                       or . == "STARTUP_FAILURE")] | length')
            if [ "$bad" -gt 0 ]; then
              echo "PR #$num: CI is not green ($bad failing). Leaving it open."
              continue
            fi

            pending=$(printf '%s' "$checks" | jq '[.[]
              | select((.__typename == "CheckRun" and .status != "COMPLETED")
                    or (.__typename == "StatusContext" and .state == "PENDING"))]
              | length')
            if [ "$pending" -gt 0 ]; then
              echo "PR #$num: $pending check(s) still running. Retry next week."
              continue
            fi

            total=$(printf '%s' "$checks" | jq 'length')
            echo "PR #$num: all green ($total check(s)). Merging $sha."
            if gh pr merge "$num" --squash --delete-branch --match-head-commit "$sha"; then
              echo "PR #$num: merged."
            else
              echo "PR #$num: merge failed."
              failed=1
            fi
          done

          exit "$failed"
