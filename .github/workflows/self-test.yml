name: self-test

# この repo の reusable workflow の shell の手順を、偽の道具で実行して確かめる (tests/)。あわせて workflow 全部を actionlint で検査する
# (actionlint.yml を自分で呼ぶので、reusable workflow そのものも動くかがここで分かる)。
# reusable workflow ではない (呼び出し側から uses しない)。
# workflow かテストを変えた push / PR だけで回す。
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  dupscan-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 tests/dupscan-gate-test
  actionlint:
    uses: ./.github/workflows/actionlint.yml
